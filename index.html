<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyBaby — Track Who's Already Betting</title>
<meta name="description" content="Free Polymarket whale tracker. Real-time alerts, 30-min pre-game sports picks, smart money divergence detection. 229 wins, 359 calls, 63.8% verifiable in Discord.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

  .page{height:100vh;display:flex;flex-direction:column;padding:32px 48px}

  /* Top bar */
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#888}
  .brand{color:#fff;font-weight:600;letter-spacing:6px;font-size:16px}
  .status-center{color:#888}
  .live{display:flex;align-items:center;gap:8px;color:#fff}
  .live-dot{width:8px;height:8px;background:#EC4899;border-radius:50%;animation:blink 1.5s infinite;box-shadow:0 0 12px rgba(236,72,153,0.8)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

  /* Center: POLYBABY wordmark */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;position:relative}

  .wordmark{
    font-family:'Modak','Bagel Fat One',cursive;
    font-weight:400;
    font-size:clamp(64px,13vw,200px);
    line-height:1;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg,#FF3D8C 0%,#FF6FA0 22%,#FF9C7A 50%,#FFB85E 75%,#FFD43B 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(236,72,153,0.25)) drop-shadow(0 0 60px rgba(255,212,59,0.15));
    animation:glow 3s ease-in-out infinite;
    user-select:none;
    text-align:center;
    padding:0 16px;
  }
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 30px rgba(236,72,153,0.3)) drop-shadow(0 0 60px rgba(255,212,59,0.2))}
    50%{filter:drop-shadow(0 0 50px rgba(236,72,153,0.55)) drop-shadow(0 0 100px rgba(255,212,59,0.35))}
  }

  .features-strip{display:flex;gap:32px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#666;flex-wrap:wrap;justify-content:center;max-width:900px;text-align:center}
  .features-strip span{position:relative}
  .features-strip span:not(:last-child)::after{content:"·";position:absolute;right:-20px;color:#444}

  /* Bottom row */
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:48px;flex-wrap:wrap}
  h1{font-size:clamp(48px,9vw,140px);font-weight:800;line-height:0.92;letter-spacing:-3px;text-transform:uppercase}
  h1 .accent{color:#EC4899}
  .cta{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(90deg,#EC4899 0%,#FF9C7A 50%,#FFD43B 100%);color:#000;padding:24px 48px;border-radius:999px;font-weight:700;font-size:18px;text-decoration:none;letter-spacing:1px;text-transform:uppercase;transition:transform .15s,box-shadow .15s;white-space:nowrap}
  .cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(236,72,153,0.4)}

  /* Footer */
  .footer-strip{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#444;margin-top:24px;padding-top:20px;border-top:1px solid #1A1A1A;flex-wrap:wrap;gap:16px}
  .footer-strip a{color:#666;text-decoration:none;margin:0 8px}
  .footer-strip a:hover{color:#EC4899}

  /* Mobile */
  @media (max-width:768px){
    html,body{overflow-y:auto;overflow-x:hidden}
    .page{padding:24px;min-height:100vh;height:auto}
    .top{font-size:10px;letter-spacing:1px;flex-direction:column;gap:12px;text-align:center}
    .status-center{order:3}
    .wordmark{font-size:18vw}
    .features-strip{font-size:10px;gap:16px}
    .features-strip span:not(:last-child)::after{right:-12px}
    .bottom{flex-direction:column;align-items:flex-start;gap:24px}
    h1{font-size:14vw;letter-spacing:-2px}
    .cta{padding:18px 32px;font-size:15px;width:100%;justify-content:center}
    .footer-strip{font-size:10px;letter-spacing:1px;justify-content:center;text-align:center}
    .footer-strip > div{width:100%}
  }
</style>
</head>
<body>

<div class="page">

  <div class="top">
    <div class="brand">POLYBABY</div>
    <div class="status-center">FREE · POLYMARKET WHALE TRACKER</div>
    <div class="live"><span class="live-dot"></span>229 / 359 · 63.8%</div>
  </div>

  <div class="center">
    <div class="wordmark">POLYBABY</div>
    <div class="features-strip">
      <span>Real-time whale alerts</span>
      <span>30-min pre-game picks</span>
      <span>Smart money divergence</span>
      <span>Auto-resolved tape</span>
    </div>
  </div>

  <div class="bottom">
    <h1>Track<br>Who's<br>Betting<span class="accent">.</span></h1>
    <a class="cta" href="https://discord.gg/Ba6ZgHANKK">Join Discord →</a>
  </div>

  <div class="footer-strip">
    <div>© 2026 PolyBaby · Not affiliated with Polymarket · For entertainment only</div>
    <div>
      <a href="mailto:bhavikarjunkakkar999@gmail.com">Contact</a>
      <a href="privacy.html">Privacy</a>
      <a href="https://discord.gg/Ba6ZgHANKK">Discord</a>
    </div>
  </div>

</div>

</body>
</html>
